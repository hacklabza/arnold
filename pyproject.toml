[tool.poetry]
name = "arnold"
version = "0.1.0"
description = "RPi 4 Based Robotic Platform"
authors = ["Jonathan Bydendyk <jonathan@hacklab.co.za>"]
license = "BSD-3-Clause"
readme = "README.md"
packages = [
    { include = "arnold/cli" },
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.4"
click = "^8.1.7"
gpiozero = "^2.0.1"
nltk = "^3.9.1"
oauth2client = "^4.1.3"
PyAudio = "^0.2.14"
pyserial = "^3.5"
python-dotenv = "^1.0.1"
pyttsx3 = "^2.91"
smbus2 = "^0.4.3"
SpeechRecognition = "^3.14.3"
uvicorn = "^0.30.6"
mpu9250-jmdev = "^1.0.12"
openai = "^1.107.3"
sounddevice = "^0.5.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-mock = "^3.14.0"
requests-mock = "^1.12.1"
py3-tts = "^3.5"
pre-commit = "^4.3.0"
ruff = "^0.13.0"

[tool.poetry.group.rpi.dependencies]
picamera2 = "^0.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
arnold = "arnold.cli:cli"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
ignore = ["F821"]
