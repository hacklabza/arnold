[tool.poetry]
name = "arnold"
version = "0.9.0"
description = "RPi 4 Based Robotic Platform"
authors = ["Jonathan Bydendyk <jonathan@hacklab.co.za>"]
license = "BSD-3-Clause"
readme = "README.md"
packages = [
    { include = "arnold/cli" },
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.143.0"
click = "^8.5.0"
gpiozero = "^2.0"
nltk = "^3.10.3"
oauth2client = "^4.1.3"
PyAudio = "^0.2.14"
pyserial = "^3.5"
python-dotenv = "^1.1.0"
pyttsx3 = "^2.93rc1"
smbus2 = "^0.6.1"
SpeechRecognition = "^3.15.0"
uvicorn = "^0.54.0"
openai = "^1.79.0"
sounddevice = "^0.5.3"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-mock = "^3.16.0"
requests-mock = "^1.12.1"
py3-tts = "^4.1"
pre-commit = "^4.2.0"
ruff = "^0.9.9"

[tool.poetry.group.rpi.dependencies]
picamera2 = "^0.3.38"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
arnold = "arnold.cli:cli"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
ignore = ["F821"]
